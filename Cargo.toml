[workspace]
members = [".", "resume-tui-data", "to_pdf", "browser"]
default_members = ["."]

[workspace.package]
name = "resume-tui"
version = "0.0.4"
edition = "2021"
authors = ["Robert Masen <r.f.masen@gmail.com>"]
description = "My resume as a TUI application"
homepage = "https://gh.freemasen.com/resume-tui/"
repository = "https://github.com/FreeMasen/resume-tui"

[package]
name = "resume-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[workspace.dependencies]
color-eyre = "0.6"
log = "0.4"
pulldown-cmark = "0.12"
thiserror = "2"
resume-tui-data = { path = "./resume-tui-data" }
ratatui = { version = "0.29", default-features = false }

[dependencies]
color-eyre.workspace = true
log.workspace = true
pulldown-cmark.workspace = true
thiserror.workspace = true
ratatui.workspace = true
crossterm = { version = "0.28", optional = true }
env_logger = { version = "0.11", optional = true }
resume-tui-data.workspace = true
to_pdf = { path = "./to_pdf", optional = true }

[dev-dependencies]
insta = "1.36"
env_logger = "0.11"

[features]
default = ["crossterm", "pdf"]
logging = ["dep:env_logger"]
crossterm = ["dep:crossterm", "ratatui/crossterm"]
pdf = ["dep:to_pdf"]

[package.metadata.wix]
upgrade-guid = "B050A522-06FC-432E-B378-BFCF6C47F3B7"
path-guid = "1ED758D5-D16C-44F3-B9C5-CB42E045CB08"
license = false
eula = false

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
